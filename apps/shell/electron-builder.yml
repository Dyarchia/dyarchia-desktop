appId: dev.dyarchia.desktop
productName: dyarchia
directories:
    output: release
files:
    - out/**
extraResources:
    - from: ../../packages/pysdk
      to: pysdk
      filter:
          - dyarchia_sdk/**
    # Every plugin the shell knows about, staged by scripts/stage-plugins.mjs from each manifest.
    # They ship enabled by nobody: the setup panel is what turns one on.
    - from: build/plugins
      to: plugins
asar: true
win:
    target:
        - portable
    icon: null
portable:
    artifactName: dyarchia-${version}.exe

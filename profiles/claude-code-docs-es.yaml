name: claude-code-docs-es
description: Claude Code documentation, Spanish pages, tracked from its markdown variants
sitemap_urls:
  - https://code.claude.com/docs/sitemap.xml
include:
  - /docs/es/
fetch_suffix: .md
crawler: http
extract: text
formats:
  - jsonl
max_concurrency: 4
max_requests_per_minute: 120
snapshot: true
min_success_rate: 0.95

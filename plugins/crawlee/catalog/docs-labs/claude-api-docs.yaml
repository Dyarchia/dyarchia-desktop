name: claude-api-docs
group: docs-labs
description: Claude Platform and API documentation, English pages, tracked from its markdown variants
sitemap_urls:
  - https://platform.claude.com/sitemap.xml
include:
  - /docs/en/
fetch_suffix: .md
exclude:  # excluded 2026-08-17 after auditing what the corpus had collected
  - /release-notes/  # changelogs
  - /about-claude/pricing  # pricing page
crawler: http
extract: text
formats:
  - jsonl
max_concurrency: 4
max_requests_per_minute: 120
snapshot: true
min_success_rate: 0.95

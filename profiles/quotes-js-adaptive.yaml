name: quotes-js-adaptive
description: The same target as quotes-js, letting the adaptive crawler decide when a browser is needed
start_urls:
  - https://quotes.toscrape.com/js/
crawler: adaptive
extract: none
selectors:
  quotes: 'all:.quote .text'
  authors: 'all:.quote .author'
max_depth: 1
max_pages: 10
include:
  - /js/page/
formats:
  - json

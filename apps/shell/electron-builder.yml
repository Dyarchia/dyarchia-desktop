appId: dev.dyarchia.desktop
productName: dyarchia
directories:
    output: release
files:
    - out/**
extraResources:
    - from: ../../packages/pysdk
      to: pysdk
      filter:
          - dyarchia_sdk/**
    # Every plugin the shell knows about, staged by scripts/stage-plugins.mjs from each manifest.
    # The core four load on every launch; the rest are what the setup panel turns on.
    - from: build/plugins
      to: plugins
    # The native dependencies the staging script hoists beside the plugins, so that two plugins
    # wanting node-pty carry one copy of it. electron-builder drops a directory called
    # node_modules when it sits at the root of what is being copied, with no option to keep it,
    # so it is copied again by naming it directly — where it is not at the root of anything.
    - from: build/plugins/node_modules
      to: plugins/node_modules
asar: true
# Beside the executable, where Electron and Chromium already put theirs. The Open Font License
# asks that every copy of the fonts carry the licence and both copyright notices, and the fonts
# are inside the renderer bundle, so the notice travels next to it.
extraFiles:
    - from: ../../LICENSE
      to: LICENSE.txt
    - from: ../../NOTICE.md
      to: NOTICE.md
    - from: ../../packages/kanon/fonts/OFL.txt
      to: licenses/OFL.txt
# Chromium ships 55 locale files, 48 MB, and they are its own strings — the menu it draws on a
# right click. Nothing in this application is translated, so the rest cannot be reached.
electronLanguages:
    - en-US
    - es
# Where a build is published and, the same thing read the other way, where an installed copy looks
# for a newer one. `electron-updater` resolves this into the releases API of this repository and
# reads `latest.yml` out of the newest release's assets, which `electron-builder --publish` uploads
# beside the installer. A release cut without it is a release no installed copy can see, which is
# the whole reason `scripts/release.mjs` exists rather than a note in a README.
publish:
    provider: github
    owner: Dyarchia
    repo: dyarchia-desktop
    # A draft is the default, and a draft is invisible: to the releases page, to gh, and to
    # every installed copy asking whether there is a newer one. Every release here is a
    # prerelease, so that is what an upload makes.
    releaseType: prerelease
win:
    target:
        - nsis
    # One file, both taskbars. Windows embeds a single icon in the executable and never swaps it
    # for the theme, so the tile is the black the mark was drawn on, which is also `--dya-bg`:
    # 1.29 against a dark taskbar, where it all but disappears and leaves the mark floating, and
    # 18.93 against a light one, where it reads as a solid block. electron-builder converts the
    # png and requires at least 256; this is 1024.
    icon: icon.png
# An installed application, not a portable archive. A portable build unpacks itself into
# %TEMP%\<guid> on every launch, which made the installation directory both unfindable and
# different each time: every plugin resolving a path against its own directory — crawlee resolves
# its corpus, its profiles and its index that way — was writing into a folder Windows deletes.
# `installer.nsh` holds two things NSIS has no option for: the install directory, which is
# ~/.dyarchia/app and not %LOCALAPPDATA%\Programs, and the answer to the question an assisted
# installer asks about who the application is for. `perMachine: false` does not mean per user,
# it means the installer asks, and the answer that installs for everyone elevates into Program
# Files, where the application cannot write.
nsis:
    oneClick: false
    perMachine: false
    allowElevation: false
    include: installer.nsh
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    shortcutName: dyarchia
    uninstallDisplayName: dyarchia ${version}
    deleteAppDataOnUninstall: false
    artifactName: dyarchia-${version}-setup.exe

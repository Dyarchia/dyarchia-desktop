name: claude-api-docs
description: Claude Platform and API documentation, English pages, tracked from its markdown variants
sitemap_urls:
  - https://platform.claude.com/sitemap.xml
include:
  - /docs/en/
fetch_suffix: .md
crawler: http
extract: text
formats:
  - jsonl
max_concurrency: 4
max_requests_per_minute: 120
snapshot: true
min_success_rate: 0.95

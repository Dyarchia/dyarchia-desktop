<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>eforoi panel harness</title>
<link rel="stylesheet" href="/packages/kanon/css/dyarchia.css">
<style>
    html, body { margin: 0; height: 100%; background: var(--dya-bg); }
    #host { height: 100vh; }
</style>
</head>
<body>
<div id="host"></div>
<script type="module">
import { activate } from '/packages/plugin-eforoi/dist/renderer.js'

const CATALOG = {
    entries: [
        { key: 'anthropic/claude-haiku-4-5', label: 'Claude Haiku 4.5', group: 'Anthropic', rank: 4,
          modes: [{ mode: 'subscription', route: 'claude', model: 'haiku', efforts: [], available: true }] },
        { key: 'anthropic/claude-sonnet-5', label: 'Claude Sonnet 5', group: 'Anthropic', rank: 3,
          modes: [{ mode: 'subscription', route: 'claude', model: 'sonnet', efforts: ['low','high'], available: true }] },
        { key: 'anthropic/claude-opus-5', label: 'Claude Opus 5', group: 'Anthropic', rank: 1,
          modes: [{ mode: 'subscription', route: 'claude', model: 'opus', efforts: ['low','high'], available: true }] },
        { key: 'anthropic/claude-fable-5', label: 'Claude Fable 5', group: 'Anthropic', rank: 2,
          modes: [{ mode: 'subscription', route: 'claude', model: 'fable', efforts: ['low','high'], available: true }] }
    ],
    routes: { claude: { available: true }, codex: { available: false, reason: 'not installed' },
              opencode: { available: false }, anthropic: { available: false }, openai: { available: false } }
}

const MEMBER = (n) => `## Respuesta del miembro ${n}

Sí se puede, con un matiz: lo que obtienes en suscripción es un **coste sombra**, no un
cargo facturado. Los tokens son exactos; el dólar es una estimación.

### Qué es exacto

Cada request que Claude Code hace al modelo devuelve un bloque \`usage\` con
\`input_tokens\`, \`output_tokens\` y \`cache_read_input_tokens\`.

\`\`\`python
def turnos(path):
    # acumula el coste por step, deduplicando por message.id
    u = msg.get("usage", {})
    c = cost(msg.get("model", ""), u)
    tools = [b.get("name") for b in msg.get("content", []) if b.get("type") == "tool_use"]
    actual["steps"].append({
        "ts": e["timestamp"],
        "sidechain": bool(e.get("isSidechain")),
        "usd": round(c, 6),
    })
    return turnos
\`\`\`

---

Tres detalles que separan un script correcto de uno que miente:

- **Deduplica** por \`message.id\` + \`requestId\`
- **Subagentes** aparecen con \`isSidechain: true\`
  - encadenados por \`parentUuid\`
- La **compactación** inyecta entradas de resumen

1. Primero mide la ventana
2. Después atribuye el coste

> Atribuir dólares a un step es engañoso si lo haces ingenuamente.

| Route | Mecanismo | Coste |
|-------|-----------|-------|
| claude | \`--resume\` | $0.0376 |
| codex | \`exec resume\` | $0.0493 |

Fuente: [Manage costs](https://code.claude.com/docs/en/costs)`

const ANSWER = `Sí se puede, con un matiz importante: lo que obtienes en suscripción es un
**coste sombra**, no un cargo facturado.

## Tres vías para conseguirlo

1. Lo que ya existe sin programar nada — \`/usage\` dentro de Claude Code
2. Parsear el JSONL de sesión, que es la vía más directa
3. Telemetría OpenTelemetry + hooks

\`\`\`bash
npx ccusage@latest --breakdown
\`\`\`

### Qué métrica usar en suscripción

Si estás en Pro/Max, el dólar sombra sirve para *comparar* tareas entre sí. Pero la
métrica accionable es otra: **qué porcentaje de tu ventana de 5 horas consumió cada
prompt.**

- No uses un proxy tipo LiteLLM con credenciales OAuth: choca con los términos
- Queda sin confirmar si el Agent SDK con credenciales de suscripción reporta
  \`total_cost_usd\` fiable`

const ANALYSIS = {
    consensus: [
        { claim: 'Los tokens consumidos por request son datos exactos que el sistema expone', supported_by: [1, 2, 3] },
        { claim: 'En una suscripción Pro/Max no existe facturación real por prompt', supported_by: [1, 2, 3] }
    ],
    contradictions: [
        { topic: '¿Es posible obtener el desglose por prompt estando en suscripción?',
          positions: [
            { member: 1, position: 'No es posible; habría que pasar a una API pay-as-you-go' },
            { member: 2, position: 'Sí es posible: los tokens quedan registrados en JSONL local' }
          ] }
    ],
    partial_coverage: [
        { point: 'Usage & Cost Admin API como fuente oficial para cuentas API', covered_by: [1] }
    ],
    unique_insights: [
        { member: 2, insight: 'Atribuir coste por step es engañoso porque cada request reenvía el contexto acumulado' }
    ],
    blind_spots: [
        'Ninguno aclara si el Agent SDK funciona con credenciales de suscripción',
        'Nadie menciona cómo medir el coste de prompts hechos en claude.ai'
    ]
}

let listener = null
const ctx = {
    pluginId: 'eforoi',
    registerPanel(descriptor, mount) {
        mount(document.getElementById('host'), { instanceId: 'eforoi#1', close() {} })
    },
    on(channel, fn) { listener = fn; return () => { listener = null } },
    async invoke(channel, payload) {
        if (channel === 'catalog') return CATALOG
        if (channel === 'panels') return { path: 'C:/probe/panels.json', items: [] }
        if (channel === 'run') { setTimeout(() => drive(payload), 60); return 'run-1' }
        return true
    }
}

function emit(event) { listener?.({ ...event, runId: 'run-1' }) }

function drive(config) {
    emit({ type: 'stage', stage: 'panel' })
    config.panel.forEach((seat, i) => {
        emit({ type: 'member:done', result: {
            index: i + 1, seat, text: MEMBER(i + 1), ms: 12400 + i * 3000,
            usage: { inputTokens: 4200, outputTokens: 1830, cachedTokens: 0, costUsd: 0.0412, billing: 'plan' }
        } })
    })
    emit({ type: 'stage', stage: 'analysis' })
    emit({ type: 'analysis', analysis: ANALYSIS, ms: 18300, usage: {} })
    emit({ type: 'stage', stage: 'answer' })
    emit({ type: 'done', answer: ANSWER, summary: {
        ms: 220150, costUsd: 0.183, meteredCostUsd: 0, inputTokens: 41000, outputTokens: 19656
    } })
}

activate(ctx)

window.__drive = () => {
    document.querySelector('.eforoi-prompt').value = '¿Se puede medir el coste por prompt en suscripción?'
    document.querySelectorAll('.dya-button')[0].click()
}
</script>
</body>
</html>

}

    runId: run.runId,
    state: step.state,

    inputTokens: step.inputTokens,

    startedAt: run.startedAt,

        closeRun(run, 'completed', 'Parsed the short id out of the launch line and covered both invocation shapes in the probe.', null)

        })
        land(card, 'blocked')
    }
    emit({ type: 'run:ended', slug: 'dyarchia', cardId: card.id, outcome: run.outcome })
}

const walk = (card, run, index) => {
    if (card.status !== 'running' || run.endedAt !== null) return
    const step = SCRIPT[index]
    if (!step) {
        finish(card, run)
        return
    }
    run.inputTokens = step.inputTokens
    run.outputTokens = step.outputTokens
    emit({ type: 'card:progress', ...progressOf(card, run, step) })
    later(() => walk(card, run, index + 1), step.ms)
}

const fakePty = (port) => {
    let opened = false
    let chatter = 0
    let line = ''
    const send = (text) => port.postMessage({ t: 'data', d: text })

    const beat = window.setInterval(() => {
        if (!opened) return
        send(`${PTY_CHATTER[chatter % PTY_CHATTER.length]}\r\n`)
        chatter += 1
    }, 4_000)

    port.onmessage = (event) => {
        const message = event.data
        if (message.t === 'resize') {
            if (opened) return
            opened = true
            send(`${PTY_BANNER.join('\r\n')}\r\n`)
            return
        }
        if (message.t === 'in') {
            const data = message.d
            if (data === '\r') {
                const answer = line.trim()
                line = ''
                send('\r\n')
                if (answer === '1' || answer === '2') {
                    send(`${ESC}[32m  allowed${OFF}\r\n${DIM}  Bash(npx tsc -p packages/plugin-kanban)${OFF}\r\n`)
                } else if (answer === '3') {
                    send(`${ESC}[31m  refused${OFF}\r\n${DIM}  looking for another way${OFF}\r\n`)
                } else {
                    send(`${DIM}  heard: ${answer}${OFF}\r\n`)
                }
                return
            }
            if (data === '\u007f') {
                if (!line) return
                line = line.slice(0, -1)
                send('\b \b')
                return
            }
            line += data
            send(data)
            return
        }
        if (message.t === 'detach') {
            window.clearInterval(beat)
            port.close()
        }
    }
}

const ctx = {
    pluginId: 'kanban',
    token: (name) => getComputedStyle(document.documentElement).getPropertyValue(`--dya-${name.replace(/^--dya-/, '')}`).trim(),
    onThemeChange: () => () => {},
    on: (channel, listener) => {
        listeners.add(listener)
        return () => listeners.delete(listener)
    },
    registerPanel: (descriptor, mountPanel) => {
        mountPanel(document.getElementById('host'), { instanceId: 'kanban#0', close: () => {} })
    },
    invoke: async (channel, ...args) => {
        if (channel === 'boards') return REGISTRY
        if (channel === 'pickWorkdir') return 'C:\\Users\\Usuario\\ai-department\\dyarchia'
        if (channel === 'board') {
            const board = REGISTRY.find((entry) => entry.slug === args[0])
            if (!board) throw new Error(`no board '${args[0]}'`)
            return structuredClone({ board, cards, rules: RULES, now: Date.now() })
        }
        if (channel === 'createBoard') {
            const created = {
                slug: `board-${REGISTRY.length}`,
                name: String(args[0].name ?? '').trim() || 'a new board',
                workdir: args[0].workdir,
                archived: false,
                createdAt: Date.now(),
                order: REGISTRY.length
            }
            REGISTRY.push(created)
            emit({ type: 'boards:changed' })
            return created
        }
        if (channel === 'updateBoard') {
            const board = REGISTRY.find((entry) => entry.slug === args[0])
            if (!board) throw new Error(`no board '${args[0]}'`)
            const name = String(args[1].name ?? '').trim()
            if (!name) throw new Error('the board needs a name')
            board.name = name
            if (args[1].workdir !== undefined) board.workdir = args[1].workdir
            emit({ type: 'boards:changed' })
            return board
        }
        if (channel === 'archiveBoard') {
            const board = REGISTRY.find((entry) => entry.slug === args[0])
            if (cards.some((card) => card.status === 'running')) throw new Error('that board still has a card running')
            board.archived = args[1] !== false
            emit({ type: 'boards:changed' })
            return board
        }
        if (channel === 'deleteBoard') {
            const index = REGISTRY.findIndex((entry) => entry.slug === args[0])
            if (index < 0) throw new Error(`no board '${args[0]}'`)
            if (cards.some((card) => card.status === 'running')) throw new Error('that board still has a card running')
            REGISTRY.splice(index, 1)
            emit({ type: 'boards:changed' })
            return true
        }
        if (channel === 'createCard') {
            seq += 1
            const card = {
                ...structuredClone(cards[0]),
                id: `new-${seq}`,
                rev: 1,
                title: args[1].title,
                body: '',
                status: 'triage',
                priority: 0,
                parents: [],
                runs: [],
                comments: [],
                locked: false,
                createdAt: Date.now(),
                updatedAt: Date.now()
            }
            cards.push(card)
            changed()
            return card
        }
        if (channel === 'moveCard') {
            const card = byId(args[1])
            if (card.rev !== args[2]) throw new Error('that card changed while you were moving it')
            if (!RULES.allow[card.status].includes(args[3])) throw new Error(`a card cannot go from ${card.status} to ${args[3]}`)
            card.status = args[3]
            touch(card)
            changed()
            return card
        }
        if (channel === 'updateCard') {
            if (String(args[2].title ?? '').startsWith('!')) {
                throw new Error('the harness refuses a title that starts with !, so the error path can be driven')
            }
            const card = byId(args[1])
            Object.assign(card, args[2])
            if (card.status === 'scheduled' && card.scheduledFor && card.scheduledFor <= Date.now()) {
                card.status = 'ready'
                card.scheduledFor = null
            }
            touch(card)
            changed()
            return card
        }
        if (channel === 'deleteCard') {
            const index = cards.findIndex((card) => card.id === args[1])
            cards.splice(index, 1)
            changed()
            return true
        }
        if (channel === 'comment') {
            const card = byId(args[1])
            card.comments.push({ at: Date.now(), author: 'user', text: args[2] })
            touch(card)
            changed()
            return card
        }
        if (channel === 'dispatchNow') {
            tick()
            return true
        }
        if (channel === 'stopCard') {
            const card = byId(args[1])
            const run = card.runs[card.runs.length - 1]
            if (!run || run.endedAt !== null) throw new Error('that card has no live run')
            closeRun(run, 'crashed', null, 'crashed with no evidence of work')
            card.consecutiveFailures += 1
            land(card, 'ready')
            emit({ type: 'run:ended', slug: 'dyarchia', cardId: card.id, outcome: 'crashed' })
            return true
        }
        if (channel === 'unblock') {
            const card = byId(args[1])
            if (card.rev !== args[2]) throw new Error('that card changed while you were unblocking it')
            const back = card.parents.length ? 'todo' : (card.sourcePhase ?? 'ready')
            card.blockKind = null
            card.sourcePhase = null
            land(card, back)
            changed()
            return card
        }
        if (channel === 'runEvents') {
            const card = byId(args[1])
            return card?.runs.length ? structuredClone(HISTORY) : []
        }
        if (channel === 'addAttachments') {
            const card = byId(args[1])
            const added = [{ name: `given-${card.attachments.length + 1}.md`, bytes: 2048, at: Date.now() }]
            card.attachments.push(...added)
            touch(card)
            changed()
            return { card, refused: card.attachments.length > 2 ? ['enormous.bin'] : [] }
        }
        if (channel === 'removeAttachment') {
            const card = byId(args[1])
            card.attachments = card.attachments.filter((file) => file.name !== args[2])
            touch(card)
            changed()
            return card
        }
        if (channel === 'reveal') {
            window.alert(`the shell would show '${args[2]}' in its folder`)
            return true
        }
        if (channel === 'events') {
            const rows = structuredClone(EVENTS)
            return args[1] ? rows.filter((row) => row.cardId === args[1]) : rows
        }
        if (channel === 'diagnostics') {
            const found = structuredClone(DIAGNOSTICS)
            if (!IGNORING.ignored) {
                found.push({
                    slug: 'dyarchia',
                    cardId: null,
                    problem: 'this project does not ignore .claude/worktrees, so a run shows up in its git status'
                })
            }
            const landed = TREES.filter((tree) => tree.landed && !tree.live).length
            if (landed) {
                found.push({ slug: 'dyarchia', cardId: null, problem: `${landed} landed worktree can be removed` })
            }
            return found
        }
        if (channel === 'worktrees') return structuredClone(TREES)
        if (channel === 'removeWorktree') {
            const index = TREES.findIndex((tree) => tree.path === args[1])
            if (index < 0) throw new Error('that worktree is not on this board any more')
            if (TREES[index].live) throw new Error('a worker is still using that worktree')
            if (!TREES[index].landed) throw new Error('that worktree holds commits nothing has landed')
            TREES.splice(index, 1)
            return true
        }
        if (channel === 'ignoreState') return { ...IGNORING }
        if (channel === 'addIgnore') {
            IGNORING.ignored = true
            return { ...IGNORING }
        }
        if (channel === 'attach') {
            const request = args[0]
            const card = byId(request.cardId)
            const run = card?.runs[card.runs.length - 1]
            if (!run || run.endedAt !== null) throw new Error('that card has no session to attach to')
            const pair = new MessageChannel()
            fakePty(pair.port1)
            pair.port1.start()
            window.postMessage({ dyarchiaPort: { pluginId: 'kanban', attachId: request.attachId } }, '*', [pair.port2])
            return run.shortId
        }
        throw new Error(`the harness has no '${channel}'`)
    }
}

window.addEventListener('beforeunload', () => {
    window.clearInterval(heartbeat)
    for (const id of timers) window.clearTimeout(id)
})

localStorage.setItem('kanban:board:kanban#0', 'dyarchia')
activate(ctx)
</script>
</body>
</html>

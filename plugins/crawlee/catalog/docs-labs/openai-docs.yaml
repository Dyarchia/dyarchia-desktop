name: openai-docs
group: docs-labs
description: OpenAI developer documentation, tracked from the markdown variants it publishes
sitemap_urls:
  - https://developers.openai.com/sitemap-index.xml
include:
  - /api/docs/
  - /cookbook/
  - /plugins/
  - /learn/
  - /workspace-agents/
fetch_suffix: .md
exclude:  # excluded 2026-08-17 after auditing what the corpus had collected
  - /cookbook/topic/  # link-only topic indexes
  - /cookbook/archive/  # link-only archive index
crawler: http
extract: text
formats:
  - jsonl
max_concurrency: 4
max_requests_per_minute: 120
snapshot: true
min_success_rate: 0.95

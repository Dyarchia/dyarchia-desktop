name: books-toscrape-parsel
description: The same catalogue as books-toscrape, parsed with Parsel instead
start_urls:
  - https://books.toscrape.com/
crawler: parsel
extract: none
selectors:
  title: h1
  price: .price_color
  availability: .availability
  cover: '#product_gallery img@src'
  breadcrumbs: 'all:.breadcrumb li'
max_depth: 2
max_pages: 40
include:
  - /catalogue/
exclude:
  - /category/
formats:
  - json

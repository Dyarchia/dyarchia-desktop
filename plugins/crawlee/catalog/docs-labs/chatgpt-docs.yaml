name: chatgpt-docs
group: docs-labs
description: ChatGPT and Codex documentation, tracked from its markdown variants
sitemap_urls:
  - https://learn.chatgpt.com/sitemap-index.xml
include:
  # Anchored at the first path segment, not merely contained. learn.chatgpt.com serves every locale
  # under its own root, and `/docs/` matched `/de-DE/docs/` too: eight locales of 259 pages each
  # entered the corpus that way on the 2026-09-08 sweep, taking it from 260 pages to 2,332. Anchoring
  # keeps the two English sections and drops any locale, including one added later.
  - 're:^https://learn\.chatgpt\.com/(docs|use-cases)/'
fetch_suffix: .md
crawler: http
extract: text
formats:
  - jsonl
max_concurrency: 4
max_requests_per_minute: 120
snapshot: true
min_success_rate: 0.95

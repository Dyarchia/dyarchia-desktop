name: chatgpt-docs
description: ChatGPT and Codex documentation, tracked from its markdown variants
sitemap_urls:
  - https://learn.chatgpt.com/sitemap-index.xml
include:
  - /docs/
  - /use-cases/
fetch_suffix: .md
crawler: http
extract: text
formats:
  - jsonl
max_concurrency: 4
max_requests_per_minute: 120
snapshot: true
min_success_rate: 0.95
